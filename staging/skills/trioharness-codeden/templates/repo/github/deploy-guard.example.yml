# TrioHarness Lean 2.35 — EXAMPLE ONLY. It lives outside .github/workflows on purpose, so it never runs by itself.
# Copy the parts a repo needs into its own deploy workflow. The harness's own deploys go through deploy.mjs; this protects
# the deploys that run in GitHub Actions.
#
# Settings > Environments > production (owner only, through a card): "Deployment branches" = the default branch only;
# required reviewers = the owner; "Prevent self-review" on. Then no other branch can use the environment.
name: Deploy example
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # only if you deploy with Azure OIDC; trust the ENVIRONMENT in Azure, not individual branches
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # a dispatch from any other branch stops here, even before the environment rule applies
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to replace code that is not in this commit
        env:
          HEALTH_URL: https://YOUR-APP.example/health   # REPLACE: the app's public version endpoint
          SHA_FIELD: sha
        run: sh .github/scripts/pre-deploy-ancestor-check.sh   # copy templates/repo/github/pre-deploy-ancestor-check.sh to this path
      - name: Deploy (REPLACE ME)
        run: |
          echo "Replace this step with the repo's deploy command." >&2
          exit 1
